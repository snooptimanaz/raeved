<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RÆVED // Build it. Drive it. Live it.</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ===== alle Styles wie bisher (aus Platzgründen ausgelassen – du hast sie ja schon) ===== */
        /* Bitte dein bestehendes CSS hier einfügen – ich gebe dir die komplette Datei als Download-Link am Ende */
        :root { --black: #0a0a0a; --dark: #111; --darker: #050505; --card: #181818; --border: #2a2a2a; --border-light: #3a3a3a; --text: #e0e0e0; --text-dark: #888; --text-darker: #555; --danger: #cc0000; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { background:var(--black); color:var(--text); font-family:'Inter',sans-serif; line-height:1.6; overflow-x:hidden; }
        a { text-decoration:none; color:inherit; }
        /* ... alle weiteren Styles bitte aus deiner bisherigen Datei übernehmen ... */
        /* Wichtig: Die Klasse .menu-item.sub hat jetzt color:#fff; */
    </style>
</head>
<body>

<!-- ===== HEADER, MOBILE MENU, HERO, SEARCH, KATEGORIEN, PRODUKTE, ABOUT, KONTAKT, ADMIN, FOOTER, MODALS – alles wie gehabt ===== -->
<!-- Der HTML-Teil bleibt identisch – nur das JavaScript wird angepasst -->

<script>
    // ============ GLOBALE VARIABLEN ============
    const OWNER_EMAIL = 'snoop.timanaz@gmail.com';
    let carDatabase = {};    // wird per fetch geladen
    let products = [];      // wird per fetch geladen und ggf. mit localStorage überschrieben
    let orders = JSON.parse(localStorage.getItem('raeved_orders') || '[]');
    let users = JSON.parse(localStorage.getItem('raeved_users') || '[]');
    let currentUser = JSON.parse(localStorage.getItem('raeved_current_user') || 'null');
    let wishlist = JSON.parse(localStorage.getItem('raeved_wishlist') || '[]');
    let selectedVehicle = JSON.parse(localStorage.getItem('selectedVehicle') || 'null');
    let selectedBrand = '', selectedSeries = '', selectedMotor = '';

    // ============ DATEN LADEN ============
    async function loadData() {
        try {
            const [vehicleRes, productRes] = await Promise.all([
                fetch('vehicles.json'),
                fetch('products.json')
            ]);
            if (!vehicleRes.ok || !productRes.ok) throw new Error('JSON-Dateien nicht gefunden.');
            carDatabase = await vehicleRes.json();
            const defaultProducts = await productRes.json();

            // Prüfen, ob bereits Produkte im localStorage existieren (vom Admin bearbeitet)
            const storedProducts = localStorage.getItem('raeved_products');
            if (storedProducts) {
                products = JSON.parse(storedProducts);
            } else {
                products = defaultProducts;
                localStorage.setItem('raeved_products', JSON.stringify(products));
            }
        } catch (error) {
            console.error('Fehler beim Laden der Daten:', error);
            alert('Die Datenbank konnte nicht geladen werden. Bitte prüfe, ob vehicles.json und products.json im gleichen Ordner liegen.');
        }
        // Nach dem Laden die App initialisieren
        initApp();
    }

    // ============ APP INIT ============
    function initApp() {
        document.getElementById('wishlistCount').textContent = wishlist.length;
        initVehicleDropdowns();
        buildCategoryGrid();
        buildCategoryMenu();
        renderProducts();
        updateAdminMenu();

        if (selectedVehicle) {
            renderProducts();
            buildCategoryGrid();
        }
        // Event-Listener für Kategorie-Klicks (Event-Delegation)
        document.getElementById('categoryMenuContainer').addEventListener('click', function(e) {
            const btn = e.target.closest('button[data-category]');
            if (btn) {
                const category = btn.dataset.category;
                navigateToCategory(category);
            }
        });
        // Klick außerhalb schließt Dropdowns
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.custom-select').forEach(d => d.classList.remove('active'));
            }
        });
    }

    // ============ ALLE FUNKTIONEN (identisch zum vorherigen Code) ============
    // Bitte füge hier all deine bereits bestehenden Funktionen ein:
    // showPage, navigateTo, navigateToCategory, buildCategoryMenu, buildCategoryGrid,
    // filterProductsByVehicle, renderProducts, loadCategoryProducts, toggleMenu,
    // toggleDropdown, showSearchTab, initVehicleDropdowns, selectBrand, selectSeries,
    // selectMotor, hideSearchResult, showVehicleImage, searchVehicle, searchHsnTsn,
    // renderProductResults, saveWishlist, addToWishlist, removeFromWishlist,
    // renderWishlist, showWishlistModal, showLoginModal, showRegisterModal,
    // closeModal, register, login, showAdminPanel, logoutAdmin, showAdminSection,
    // renderAdminProducts, renderAdminOrders, addNewProduct, editProduct, saveProduct,
    // deleteProduct, showLegalTab, updateAdminMenu

    // ============ START ============
    loadData();
</script>
</body>
</html>
